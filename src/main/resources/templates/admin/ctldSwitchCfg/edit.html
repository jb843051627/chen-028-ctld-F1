<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('切换开关修改这一行')"/>
</head>
<body>
<form class="layui-form" th:object="${row}">
    <input type="hidden" name="id" th:value="*{id}">
    <div class="mainBox">
        <div class="main-container">
            <div class="layui-form-item">
                <label class="layui-form-label">代号 / 步子</label>
                <div class="layui-input-block" style="padding-top:9px;color:#888">
                    <span th:text="*{swNo}"></span>
                    ｜
                    <span th:switch="${row.status}">
                        <span th:case="0">待上</span>
                        <span th:case="1">已上</span>
                        <span th:case="2" style="color:#16baaa">压行（此页不可改）</span>
                        <span th:case="*">旧行·待上</span>
                    </span>
                    ｜ 改动次序 <span th:text="*{verNo}"></span>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">切换名目</label>
                <div class="layui-input-block">
                    <input type="text" name="swName" th:value="*{swName}" autocomplete="off" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">定档层级</label>
                <div class="layui-input-block">
                    <select name="levelKind" lay-filter="levelKind">
                        <option value="县定" th:selected="${row.levelKind == '县定'}">县定（挂管控分区）</option>
                        <option value="市定" th:selected="${row.levelKind == '市定'}">市定</option>
                        <option value="省定" th:selected="${row.levelKind == '省定'}">省定</option>
                    </select>
                </div>
            </div>

            <div class="layui-form-item" id="zoneItem">
                <label class="layui-form-label">分区代号</label>
                <div class="layui-input-block">
                    <input type="text" name="zoneNo" th:value="*{zoneNo}" autocomplete="off" placeholder="以分区册为准，全称由系统回写校准" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">开关三态</label>
                <div class="layui-input-block">
                    <select name="swKind" lay-filter="swKind">
                        <option value="0" th:selected="${row.swKind == 0}">0 一律走旧口径</option>
                        <option value="1" th:selected="${row.swKind == 1}">1 一律走新口径</option>
                        <option value="2" th:selected="${row.swKind == 2}">2 按桶推进</option>
                    </select>
                </div>
            </div>

            <div class="layui-form-item" id="grayItem">
                <label class="layui-form-label">开桶个数</label>
                <div class="layui-input-block">
                    <input type="number" name="grayNum" min="0" max="10" th:value="*{grayNum}" autocomplete="off" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">应覆盖处数</label>
                <div class="layui-input-inline">
                    <input type="number" name="crtNum" min="0" th:value="*{crtNum}" autocomplete="off" class="layui-input">
                </div>
                <label class="layui-form-label">已切处数</label>
                <div class="layui-input-inline">
                    <input type="number" name="hitNum" min="0" th:value="*{hitNum}" autocomplete="off" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">还差几处</label>
                <div class="layui-input-block">
                    <input type="text" id="lackView" class="layui-input" disabled th:value="*{lackNum}">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">落笔人</label>
                <div class="layui-input-block" style="padding-top:9px;color:#888">
                    建行：<span th:text="*{createBy}"></span>
                    ｜ 改三态：<span th:text="*{kindBy}"></span>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">备注</label>
                <div class="layui-input-block">
                    <textarea name="remark" class="layui-textarea" th:text="*{remark}"></textarea>
                </div>
            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit lay-filter="switchCfg-save">
                <i class="layui-icon layui-icon-ok"></i> 保存
            </button>
        </div>
    </div>
</form>
<th:block th:include="include :: footer"/>
<script>
    layui.use(['form', 'jquery'], function () {
        let form = layui.form;
        let $ = layui.jquery;
        let MODULE_PATH = rootPath + "/CtldSwitchCfgController";

        function syncView() {
            let kind = parseInt($('select[name="swKind"]').val(), 10);
            $('#grayItem').toggle(kind === 2);
            if (kind !== 2) {
                $('input[name="grayNum"]').val('');
            }
            let crt = parseInt($('input[name="crtNum"]').val(), 10);
            let hit = parseInt($('input[name="hitNum"]').val(), 10);
            $('#lackView').val((!isNaN(crt) && !isNaN(hit) && hit <= crt) ? (crt - hit) : '');
            let county = $('select[name="levelKind"]').val() === '县定';
            $('#zoneItem').toggle(county);
        }

        form.on('select(swKind)', syncView);
        form.on('select(levelKind)', syncView);
        $(document).on('input', 'input[name="crtNum"],input[name="hitNum"]', syncView);

        form.on('submit(switchCfg-save)', function (data) {
            $.ajax({
                url: MODULE_PATH + '/edit',
                data: data.field,
                dataType: 'json',
                type: 'post',
                success: function (result) {
                    if (result.code == 200) {
                        layer.msg(result.msg || '已落库', {icon: 1, time: 1000}, function () {
                            parent.layer.close(parent.layer.getFrameIndex(window.name));
                            parent.layui.table.reload("switchCfg-table");
                        });
                    } else {
                        layer.msg(result.msg, {icon: 2, time: 3000});
                    }
                }
            });
            return false;
        });

        syncView();
    });
</script>
</body>
</html>
